expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Code is immutable inside the image, so never re-stat it.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Holds the parser cache on the public (read-only) instance.
apc.shm_size = 512M
