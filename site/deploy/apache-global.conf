ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Sized for a small shared VPS: mod_php workers are ~60-100MB each, and
# Cloudflare absorbs nearly all anonymous traffic before it gets here.
<IfModule mpm_prefork_module>
	StartServers            2
	MinSpareServers         2
	MaxSpareServers         4
	MaxRequestWorkers       10
	MaxConnectionsPerChild  2000
</IfModule>
